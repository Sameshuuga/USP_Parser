[project]
name = "usp-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zack M.", email = "zackmgpt@outlook.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "openai>=3.14.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
]

[project.scripts]
usp-parser = "main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
